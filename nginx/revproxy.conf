server {
    listen 443 ssl;
      server_name localhost;

      ssl_certificate /etc/nginx/selfsigned/selfsigned.crt;
      ssl_certificate_key /etc/nginx/selfsigned/selfsigned.key;

      location /app1/ {
          proxy_pass http://lp-app1:8080/app1/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /app2/ {
          proxy_pass http://lp-app2:80/;
          sub_filter_once off;
          sub_filter_types *;
          sub_filter 'href="/' 'href="/app2/';
          sub_filter 'src="/' 'src="/app2/';
          sub_filter 'url("/' 'url("/app2/';

      }
}