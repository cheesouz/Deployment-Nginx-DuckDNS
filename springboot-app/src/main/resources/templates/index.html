<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dice roll</title>

    <link rel="icon" type="image/x-icon" th:href="@{/images/favicoon.png}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.1/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>

    <script th:src="@{/js/index.js}" defer></script>
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}" defer></script>

</head>
<body>
    <nav class="navbar navbar-expand fixed-top shadow-sm">
        <div class="container-fluid">
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/}">Home</a>
                <a class="nav-link" th:href="@{/history}">History</a>
            </div>
        </div>
    </nav>

    <div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center">
        <div id="diceImageDiv"></div>
        <a id="rollButton" class="font-size-large button p-3 mt-5" >Roll the dice</a>

        <div id="submissionDiv" class="hidden">
            <form id="submissionForm">
                <label>
                    <input id="nameInput" class="text-input" type="text" placeholder="Enter your name">
                </label>
                <button class="button" style="background-color: #A02334; color: #FFEEAD; padding: 5px 20px 5px 20px;"> Submit </button>
            </form>
        </div>
    </div>
</body>
</html>
